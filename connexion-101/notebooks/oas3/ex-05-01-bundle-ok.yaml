# Complete this file with the required informations
#  using your swagger-editor. You should
# - fix all the eventual error
# - add the missing parameters
# so that the file become a valid OAS3 spec.
openapi: 3.0.0
info:
  title: foo
  version: '0.0.1'
  description: |-
    Replace all redundant definitions with common
    $refs to components.oas3.yaml.

    Then, create a single bundled file to be used
    by you API implemenation and to be published
    in an API catalog.
  contact:
    name: API Support
    url: https://www.example.com/support
    email: robipolli@gmail.com
# One or more server
#   You can add production, staging and test environments.
#   We are using the custom `x-sandbox` to identify
#   sandbox instances
servers:
  - description: Development server
    url: https://localhost:8443/datetime/v1
  - description: Test server
    url: https://api.example.com/datetime/v1
    x-sandbox: true
    # The following custom parameter can be used
    # to declare how to check the API.
    x-healthCheck:
      url: https://api.example.com/datetime/v1/status
      interval: 300
      timeout: 15
x-commons:
  common-responses: &common-responses
    "503":
      $ref: "#/components/responses/503ServiceUnavailable"
    "GenericError":
      $ref: "#/components/responses/GenericError"
# Complete the /status path
#
paths:
  /status:
    get:
      summary: Ritorna lo stato dell'applicazione.
      description: |
        Ritorna lo stato dell'applicazione. A scopo
        di test, su base randomica puo' ritornare
        un errore.
      operationId: api.get_status
      responses:
        <<: *common-responses
        '200':
          description: |
            Il server ha ritornato lo status. In caso di problemi
            ritorna sempre un problem+json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: OK
                status: 200
                detail: The app is running smoothly.
  /echo: # TODO implement this
    get:
      parameters:
        - $ref: '#/components/parameters/tz'
      summary: Return the current timestamp in RFC3339
      description: |
        Return the current timestamp, in the specified
        timezone. If the timezone does not
        exist returns 400 Bad Request, specifying that
        the given timezone is not in our database.
      operationId: api.get_echo
      responses:
        <<: *common-responses
        '200':
          description: |
            The current timestamp.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Datetime"
              example:
                timestamp: "20010507T00:00:11Z"
        '400':
          $ref: '#/components/responses/400BadRequest'
components:
  parameters:
    tz:
      name: tz
      in: query
      schema:
        $ref: '#/components/schemas/Timezone'
  responses:
    400BadRequest:
      $ref: "https://raw.githubusercontent.com/ioggstream/python-course/refs/tags/v2026.05.1/connexion-101/notebooks/oas3/components.oas3.yaml#/components/responses/400BadRequest"
    503ServiceUnavailable:
      $ref: "https://raw.githubusercontent.com/ioggstream/python-course/refs/tags/v2026.05.1/connexion-101/notebooks/oas3/components.oas3.yaml#/components/responses/503ServiceUnavailable"
    GenericError:
      $ref: "https://raw.githubusercontent.com/ioggstream/python-course/refs/tags/v2026.05.1/connexion-101/notebooks/oas3/components.oas3.yaml#/components/responses/GenericError"
  schemas:
    Timezone:
      description: |
        A timezone in the form of continent/city
        or "UTC".
      type: string
      example: Europe/Rome
    Datetime:
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: datetime
          example: "2019-01-01T00:00:00Z"
    Problem:
      $ref: 'https://raw.githubusercontent.com/ioggstream/python-course/refs/tags/v2026.05.1/connexion-101/notebooks/oas3/components.oas3.yaml#/components/schemas/Problem'
