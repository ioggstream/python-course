# Complete this file with the required informations
#  using your swagger-editor. You should
# - fix all the eventual error
# - add the missing parameters
# so that the file become a valid OAS3 spec.
openapi: 3.0.0
info:
  title: foo
  version: "0.1.0"
  x-summary: >-
    This API provides datetime and timezone information with rate limiting.
  description: |
    This API provides application status and timezone information with throttling headers.
  termsOfService: "https://example.com/terms/"
  contact:
    email: robipolli@gmail.com
    name: Roberto Polli
    url: https://twitter.com/ioggstream
  x-api-id: 00000000-0000-0000-0000-000000000000
# One or more server
#   You can add production, staging and test environments.
#   We are using the custom `x-sandbox` to identify
#   sandbox instances
servers:
  - description: Development server
    url: https://localhost:8443/datetime/v1
  - description: Test server
    url: https://api.example.com/datetime/v1
    x-sandbox: true
    # The following custom parameter can be used
    # to declare how to check the API.
    x-healthCheck:
      url: https://api.example.com/datetime/v1/status
      interval: 300
      timeout: 15
x-commons:
  throttling-headers: &throttling-headers
    X-RateLimit-Limit:
      $ref: 'components.oas3.yaml#/components/headers/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: 'components.oas3.yaml#/components/headers/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: 'components.oas3.yaml#/components/headers/X-RateLimit-Reset'
  common-responses: &common-responses
    429:
      $ref: "#/components/responses/429TooManyRequests"
    503:
      $ref: "#/components/responses/503ServiceUnavailable"
#
# Complete the /status path
#
paths:
  /status:
    get:
      summary: Ritorna lo stato dell'applicazione.
      description: |
        Ritorna lo stato dell'applicazione. A scopo
        di test, su base randomica puo' ritornare
        un errore.
      operationId: api.get_status
      responses:
        <<: *common-responses
        '200':
          description: |
            Il server ha ritornato lo status. In caso di problemi
            ritorna sempre un problem+json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: OK
                status: 200
                detail: The app is running smoothly.
  /timezones/{continent}: # TODO implement this
    get:
      parameters:
        - $ref: "#/components/parameters/continentPath"
      summary: Return the supported timezones
      description: |
        Return a paginated list of supported
        timezones. 404 if limit and offset are
        out of bound.
      operationId: api.get_timezones_by_continent
      responses:
        <<: *common-responses
        '200':
          description: |
            A list of timezones between offset and limit.
          headers:
            <<: *throttling-headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timezones"
              example:
                entries: ["Europe/Amsterdam", "Europe/Andorra", "Europe/Astrakhan"]
                limit: 3
                offset: 0
                count: 3
        '404':
          $ref: '#/components/responses/404NotFound'
components:
  securitySchemes:
    myBasicAuth:
      type: http
      scheme: basic
      x-basicInfoFunc: security.my_auth
  parameters:
    tz:
      name: tz
      in: query
      schema:
        $ref: '#/components/schemas/Timezone'
      example: Europe/Rome
    continentPath:
      name: continent
      in: path
      required: true
      schema:
        type: string
        enum: [Africa, America, Antarctica, Arctic, Asia, Atlantic, Australia, Europe, Indian, Pacific]
      example: Europe
  responses:
    400BadRequest:
      $ref: "components.oas3.yaml#/components/responses/400BadRequest"
    404NotFound:
      $ref: "components.oas3.yaml#/components/responses/404NotFound"
    429TooManyRequests:
      $ref: "components.oas3.yaml#/components/responses/429TooManyRequests"
    503ServiceUnavailable:
      $ref: "components.oas3.yaml#/components/responses/503ServiceUnavailable"
  schemas:
    Timezone:
      description: |
        A timezone in the form of continent/city
        or "UTC".
      type: string
      example: Europe/Rome
    Datetime:
      example:
        timestamp: "2019-01-01T00:00:00Z"
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: datetime
          example: "2019-01-01T00:00:00Z"
    Problem:
      $ref: 'components.oas3.yaml#/components/schemas/Problem'
    Timezones:
      type: object
      example:
        limit: 10
        offset: 0
        count: 3
        entries:
          - Europe/Rome
          - UTC
          - Asia/Tokyo
      required:
        - limit
        - count
        - offset
        - entries
      properties:
        limit:
          type: integer
          format: int32
          example: 10
        count:
          type: integer
          format: int32
          example: 3
        offset:
          type: integer
          format: int32
          example: 0
        entries:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Timezone'
