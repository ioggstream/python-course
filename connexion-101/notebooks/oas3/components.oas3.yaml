---
openapi: "3.0.4"
info:
  title: Reusable components for OAS3 APIs.
  version: "1.0.0"
  description: |-
    This document defines common components
    for interoperable APIs.

    It is meant to be imported in other OAS3 documents, and does not define any path or server.
  contact:
    name: Roberto Polli
    url: https://github.com/ioggstream/python-course
    email: robipolli@gmail.com
paths: {}
# spectral:disable-next-line oas3-api-servers
servers: []
# checkov:skip=CKV_OPENAPI_4
# checkov:skip=CKV_OPENAPI_5
components:
  parameters:
    #
    # Pagination.
    #
    limit:
      name: limit
      in: query
      explode: false
      description: Maximum number of items to return. If unset,
        used default value 10.
      schema:
        $ref: "#/components/schemas/Limit"
      example: 10
    offset:
      name: offset
      in: query
      explode: false
      description: Offset for pagination
      schema:
        $ref: "#/components/schemas/Offset"
      example: 0
      # Common schemas.
    idWithSlashPath:
      name: idWithSlashPath
      in: path
      description: |-
        Identifier matched via the latest path segment of the agency URI.
        For example, for the agency URI `https://w3id.org/italia/data/public-organization/ISTAT`, `istat` is a valid idWithSlashPath.
      required: true
      schema:
        $ref: "#/components/schemas/AsciiText"
      example: istat
    Content-Digest:
      name: Content-Digest
      in: header
      description: |-
        A digest of the response body, used to verify the integrity of the response.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      schema:
        $ref: "#/components/schemas/Digest"
    Want-Content-Digest:
      name: Want-Content-Digest
      in: header
      required: false
      description: |-
        A request header used to ask the server to include a Content-Digest header in the response,
        with the specified digest algorithms.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      schema:
        $ref: "#/components/schemas/DigestAlgoritmsPreference"
      examples:
        ask-for-sha256:
          value: sha-256=1
          summary: Ask the server to include a sha-256 digest
            in the response.
        ask-for-sha512:
          value: sha-512=1
          summary: Ask the server to include a sha-512 digest
            in the response.
  schemas:
    AsciiText:
      description: |-
        An ASCII text string that constrains
        the length and characters of the input.

        This is a substring match on the corresponding field of
        the vocabulary metadata.
      type: string
      maxLength: 32
      pattern: "^[a-zA-Z0-9-_]{1,32}$"
    TextFilter:
      description: |-
        A text filter that constrains
        the length and characters of the input.

        This is a substring match on the corresponding field of
        the vocabulary metadata.

        Accepts ASCII letters/digits, common punctuation, and precomposed
        Latin characters (U+00C0-U+024F) covering Italian, French, German,
        Spanish and other European Latin-script languages (e.g. "città").
        Non-Latin Unicode (Cyrillic, Arabic, CJK, …) and binary bytes are
        rejected.
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9\\u00C0-\\u024F ._:/-]{1,128}$"
    Link:
      description: |-
        A link to a resource.
      type: object
      required:
      - href
      properties:
        href:
          $ref: "#/components/schemas/URI"
    URI: &URI
      description: |-
        An absolute URI.
      type: string
      format: uri
      maxLength: 2048
      pattern: >-
        ^(about:|https?://|urn:).*
      example: https://schema.gov.it/vocabularies/v1/agid/agentecausale/
    Url:
      description: |-
        An URL that is either absolute or relative.
      type: string
      format: uri-reference
      example: /vocabularies/v1/agid/agentecausale/openapi.yaml
    Limit:
      description: |-
        A limit for pagination.
        This value is bounded by the maximum number of items that can be returned by the API.
      type: integer
      format: int32
      minimum: 0
      maximum: 200
      default: 20
      example: 50
    Offset:
      description: |-
        An offset for pagination.

        This API supports at maximum ~100_000 items vocabularies.
      type: integer
      format: int32
      minimum: 0
      maximum: 100000
      default: 0
      example: 0
    Problem:
      description: |-
        Convey information conditions
        in HTTP API responses according to
        RFC 9457 Problem Details.

        Do not disclose sensitive information
        or internal implementation details.

        You need to provide the minimum
        information required to help the client
        to issue a successful request.

        Note: According to RFC9457, `type` is the only required field;
        since it defaults to `about:blank`, in this JSON Schema
        it is not required.
      additionalProperties: false
      type: object
      required:
      - title
      - status
      properties:
        type:
          <<: *URI
          default: about:blank
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          minimum: 100
          maximum: 599
          format: int32
        detail:
          type: string
          maxLength: 1024
        instance:
          $ref: "#/components/schemas/Url"
    Digest:
      description: |-
        A digest of the response body, used to verify the integrity of the response.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      type: string
      maxLength: 512
      example: >-
        sha-256=:d435Qo+nKZ+gLcUHn7GQtQ72hiBVAgqoLsZnZPiTGPk=:,
        sha-512=:YMAam51Jz/jOATT6/zvHrLVgOYTGFy1d6GJiOHTohq4yP+pgk4vf2aCsyRZOtw8MjkM7iw7yZ/WkppmM44T3qg==:
      pattern: "^(sha-256|sha-512)=:[a-zA-Z0-9+/=]+:((, +)(sha-256|sha-512)=:[a-zA-Z0-9+/=]+:)*$"
    DigestAlgoritmsPreference:
      description: |-
        A list of digest algorithms with preferences.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      type: string
      maxLength: 64
      example: sha-256=10, sha-512=0
      pattern: >-
        ^((sha-256|sha-512)=1?[0-9])(, *(sha-256|sha-512)=1?[0-9])*$
  headers:
    #
    # Response Integrity
    #
    Content-Digest:
      description: |-
        A digest of the response body, used to verify the integrity of the response.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      schema:
        $ref: "#/components/schemas/Digest"
    Want-Content-Digest:
      description: |-
        A request header used to ask the server to include a Content-Digest header in the response,
        with the specified digest algorithms.
        See RFC 9530 for details.

        Since OAS does not yet support Structured Fields serialization,
        we use a basic regexp that can be tweaked to identify the selected digest algorithms
        for your ecosystem.
      schema:
        $ref: "#/components/schemas/DigestAlgoritmsPreference"
      examples:
        ask-for-sha256:
          value: sha-256=1
          summary: Ask the server to include a sha-256 digest
            in the response.
        ask-for-sha512:
          value: sha-512=1
          summary: Ask the server to include a sha-512 digest
            in the response.
    #
    # Service management.
    #
    Retry-After:
      description: |-
        Retry contacting the endpoint *at least* after seconds.
        See https://tools.ietf.org/html/rfc7231#section-7.1.3
      schema:
        format: int32
        maximum: 186400
        minimum: 0
        type: integer
    X-RateLimit-Limit:
      description: The number of allowed requests in the current
        period
      schema:
        format: int32
        maximum: 1000000
        minimum: 0
        type: integer
    X-RateLimit-Remaining:
      description: The number of remaining requests in the current
        period
      schema:
        format: int32
        maximum: 1000000
        minimum: 0
        type: integer
    X-RateLimit-Reset:
      description: The number of seconds left in the current period
      schema:
        format: int32
        maximum: 186400
        minimum: 0
        type: integer
  responses:
    429TooManyRequests:
      description: |-
        Reusable response for Too many requests.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    400BadRequest:
      description: |-
        Bad request, e.g. when the client provides invalid input.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    503ServiceUnavailable:
      description: |-
        Service unavailable, e.g. when
        the server is overloaded or down for maintenance.
         The client should retry after the indicated time.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GenericError:
      description: |-
        The request was not successful.
        This response can be used for any error status code (4xx or 5xx) that is not covered by more specific responses.
        The client should retry after the indicated time if the error is temporary (5xx).
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
