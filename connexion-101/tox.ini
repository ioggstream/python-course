# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py3
# skip setup.py
skipsdist=True


[testenv]
deps =
    -rrequirements.txt
    -rrequirements-api.txt


# To avoid loading IPython module in the current directory, change
# current directory to ".tox/py*/tmp" before running test.
#changedir = {envtmpdir}



allowlist_externals =
  bash
commands =
  bash -c ' cd notebooks && jupyter notebook . '

[testenv:make]
# XXX: Update notedown so we don't need setuptools.
deps =
  setuptools
  # git+https://github.com/ioggstream/notedown
  /home/rpolli/workspace-py/notedown
passenv =
  SHOW_SOLUTIONS
allowlist_externals =
  make
commands =
  make
